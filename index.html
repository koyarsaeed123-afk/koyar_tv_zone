<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite TV Receiver UI</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; user-select: none; }
        body { background: #000; color: #fff; height: 100vh; overflow: hidden; }

        .player-container { position: relative; width: 100vw; height: 100vh; background: #050505; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* بانەری خوارەوەی ڕیسیڤەر */
        .infobar {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 70%; background: rgba(15, 15, 25, 0.9); border: 2px solid #333;
            border-radius: 12px; padding: 15px 25px; display: flex; align-items: center;
            justify-content: space-between; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: opacity 0.3s ease; opacity: 0; pointer-events: none; z-index: 50;
        }
        .infobar.visible { opacity: 1; }
        .infobar-left { display: flex; align-items: center; gap: 15px; }
        .infobar-left img { width: 60px; height: 45px; object-fit: contain; background: #000; border-radius: 6px; padding: 4px; border: 1px solid #444; }
        .infobar-title h3 { font-size: 20px; color: #ffcc00; margin-bottom: 4px; }
        .infobar-title p { font-size: 14px; color: #aaa; }
        .infobar-right { font-size: 18px; font-weight: bold; color: #00ffcc; background: rgba(0,255,204,0.1); padding: 6px 14px; border-radius: 8px; }

        /* لیستی کەناڵەکانی لای چەپ (OSD) */
        .osd-menu {
            position: absolute; top: 0; left: -450px; width: 420px; height: 100%;
            background: rgba(12, 12, 18, 0.95); border-left: 2px solid #222;
            display: flex; flex-direction: column; transition: left 0.3s ease; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .osd-menu.open { left: 0; }
        
        .osd-header { 
            padding: 20px; background: #1a1a24; border-bottom: 1px solid #333; 
            display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; 
        }
        .osd-group-title { font-size: 18px; color: #ffcc00; font-weight: bold; text-transform: uppercase; }
        .osd-header-sub { display: flex; justify-content: space-between; width: 100%; align-items: center; font-size: 13px; color: #aaa; }
        
        .osd-channels { flex: 1; overflow-y: auto; padding: 10px; }
        .osd-channel-item {
            display: flex; align-items: center; gap: 15px; padding: 12px 15px;
            border-radius: 8px; cursor: pointer; margin-bottom: 6px; transition: background 0.1s;
        }
        .osd-channel-item:hover, .osd-channel-item.selected { background: #2a2a3d; border-right: 4px solid #ffcc00; }
        .osd-channel-item img { width: 45px; height: 32px; object-fit: contain; background: #000; border-radius: 4px; padding: 2px; }
        .osd-channel-name { font-size: 15px; font-weight: bold; }

        /* پێشاندانی هەڵە لەسەر شاشە بۆ دیباگکردن لەسەر تیڤی */
        #errorBox {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(229, 9, 20, 0.9); color: #fff; padding: 10px 20px;
            border-radius: 8px; font-size: 14px; z-index: 200; display: none; text-align: center;
        }

        .loader { display: none; position: absolute; width: 50px; height: 50px; border: 4px solid #333; border-top: 4px solid #ffcc00; border-radius: 50%; animation: spin 0.8s linear infinite; z-index: 10; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .volume-box {
            position: absolute; top: 30px; right: 40px; background: rgba(0,0,0,0.8);
            border: 1px solid #444; padding: 10px 20px; border-radius: 10px; font-size: 18px;
            color: #ffcc00; display: none; z-index: 50;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div id="errorBox"></div>
        <div id="loader" class="loader"></div>
        <video id="mainVideo" autoplay playsinline></video>

        <!-- بانەری خوارەوەی ڕیسیڤەر -->
        <div class="infobar" id="infoBar">
            <div class="infobar-left">
                <img id="infoLogo" src="" alt="">
                <div class="infobar-title">
                    <h3 id="infoName">کەناڵ</h3>
                    <p id="infoGroup">گرووپ</p>
                </div>
            </div>
            <div class="infobar-right" id="infoIndex">01</div>
        </div>

        <!-- لیستی کەناڵەکان (OSD) -->
        <div class="osd-menu" id="osdMenu">
            <div class="osd-header">
                <div class="osd-group-title" id="osdGroupTitle">هەموو کەناڵەکان</div>
                <div class="osd-header-sub">
                    <span>گۆڕینی گرووپ: ◀ ڕاست/چەپ ▶</span>
                    <span id="channelCount">0 کەناڵ</span>
                </div>
            </div>
            <div class="osd-channels" id="osdChannelsList"></div>
        </div>

        <!-- پیشاندانی دەنگ -->
        <div class="volume-box" id="volumeBox">🔊 100%</div>
    </div>

    <input type="hidden" id="m3uUrl" value="https://raw.githubusercontent.com/koyarsaeed123-afk/koyar_tv_zone/refs/heads/main/koyar.m3u">

<script>
    var allChannels = [];
    var currentGroupChannels = [];
    var groupsList = ["هەموو کەناڵەکان"];
    var currentGroupIndex = 0;
    var currentIndex = 0;
    var hlsPlayer = null;
    var isMenuOpen = false;
    var infoTimeout = null;
    var volumeTimeout = null;

    var video = document.getElementById('mainVideo');
    var loader = document.getElementById('loader');
    var infoBar = document.getElementById('infoBar');
    var osdMenu = document.getElementById('osdMenu');
    var volumeBox = document.getElementById('volumeBox');
    var errorBox = document.getElementById('errorBox');

    function showError(msg) {
        errorBox.innerText = msg;
        errorBox.style.display = 'block';
    }

    video.addEventListener('waiting', () => loader.style.display = 'block');
    video.addEventListener('playing', () => loader.style.display = 'none');
    video.addEventListener('canplay', () => loader.style.display = 'none');

    function loadM3U() {
        var url = document.getElementById('m3uUrl').value;
        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error("نەتوانرا فایلی M3U بهێنرێت (هەڵە: " + res.status + ")");
                return res.text();
            })
            .then(data => {
                if (!data || data.trim() === "") {
                    throw new Error("فایلی M3U بەتاڵە یان خوێندرایەوە!");
                }
                parseData(data);
            }).catch(err => {
                console.error(err);
                showError(err.message);
            });
    }

    function parseData(data) {
        var lines = data.split('\n');
        allChannels = [];
        var groupSet = new Set();
        var curName = "", curGroup = "گشتی", curLogo = "";

        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith('#EXTINF:')) {
                var groupMatch = line.match(/group-title="([^"]+)"/) || line.match(/group-title:([^,\n]+)/);
                curGroup = groupMatch ? groupMatch[1].trim() : "گشتی";
                var logoMatch = line.match(/tvg-logo="([^"]+)"/) || line.match(/tvg-logo:([^,\n]+)/);
                curLogo = logoMatch ? logoMatch[1].trim() : "";
                var parts = line.split(',');
                curName = parts[parts.length - 1] || "کەناڵ";

                if (curGroup) groupSet.add(curGroup);
            } else if (line.startsWith('http')) {
                allChannels.push({ name: curName, url: line, group: curGroup, logo: curLogo });
            }
        });

        if (allChannels.length === 0) {
            showError("هیچ کەناڵێک لە فایلەکەدا نەدۆزراوەوە!");
            return;
        }

        groupsList = ["هەموو کەناڵەکان", ...Array.from(groupSet)];
        updateGroupChannels();

        var savedIndex = localStorage.getItem('tv_last_index');
        if (savedIndex !== null && savedIndex < allChannels.length) {
            currentIndex = parseInt(savedIndex);
        }
        playChannel(currentIndex, false);
    }

    function updateGroupChannels() {
        var groupName = groupsList[currentGroupIndex];
        if (currentGroupIndex === 0) {
            currentGroupChannels = [...allChannels];
        } else {
            currentGroupChannels = allChannels.filter(c => c.group === groupName);
        }
        
        document.getElementById('osdGroupTitle').innerText = groupName;
        document.getElementById('channelCount').innerText = currentGroupChannels.length + " کەناڵ";
        buildOsdList();
    }

    function buildOsdList() {
        var list = document.getElementById('osdChannelsList');
        list.innerHTML = "";
        
        currentGroupChannels.forEach((chan, idx) => {
            var item = document.createElement('div');
            var globalIdx = allChannels.findIndex(c => c.url === chan.url);
            item.className = 'osd-channel-item ' + (globalIdx === currentIndex ? 'selected' : '');
            
            item.innerHTML = `
                <span style="color:#aaa; width:30px; font-weight:bold;">${idx + 1}</span>
                <img src="${chan.logo || 'https://via.placeholder.com/45?text=TV'}" onerror="this.src='https://via.placeholder.com/45?text=TV'">
                <div class="osd-channel-name">${chan.name}</div>
            `;
            item.onclick = function() {
                currentIndex = globalIdx;
                playChannel(currentIndex, true);
                toggleOsd(false);
            };
            list.appendChild(item);
        });
    }

    function playChannel(index, showBanner = true) {
        if (allChannels.length === 0) return;
        currentIndex = (index + allChannels.length) % allChannels.length;
        var chan = allChannels[currentIndex];

        localStorage.setItem('tv_last_index', currentIndex);

        document.getElementById('infoName').innerText = chan.name;
        document.getElementById('infoGroup').innerText = chan.group;
        document.getElementById('infoLogo').src = chan.logo || 'https://via.placeholder.com/60?text=TV';
        document.getElementById('infoIndex').innerText = (currentIndex + 1 < 10 ? "0" : "") + (currentIndex + 1);

        buildOsdList();
        
        var selectedItem = document.querySelector('.osd-channel-item.selected');
        if (selectedItem) {
            selectedItem.scrollIntoView({ block: 'nearest' });
        }

        if (hlsPlayer) { hlsPlayer.destroy(); }
        var streamUrl = chan.url.trim();

        if (Hls.isSupported() && (streamUrl.includes('.m3u8') || streamUrl.includes('.ts'))) {
            hlsPlayer = new Hls();
            hlsPlayer.loadSource(streamUrl);
            hlsPlayer.attachMedia(video);
            hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            video.src = streamUrl;
            video.play();
        }

        if (showBanner) {
            showInfoBar();
        }
    }

    function showInfoBar() {
        infoBar.classList.add('visible');
        clearTimeout(infoTimeout);
        infoTimeout = setTimeout(() => {
            infoBar.classList.remove('visible');
        }, 4000);
    }

    function toggleOsd(open) {
        isMenuOpen = open !== undefined ? open : !isMenuOpen;
        if (isMenuOpen) {
            osdMenu.classList.add('open');
        } else {
            osdMenu.classList.remove('open');
        }
    }

    window.addEventListener('keydown', function(e) {
        switch(e.key) {
            case "ArrowUp":
                if (isMenuOpen) {
                    let activeSubIdx = currentGroupChannels.findIndex(c => c.url === allChannels[currentIndex].url);
                    activeSubIdx = (activeSubIdx - 1 + currentGroupChannels.length) % currentGroupChannels.length;
                    currentIndex = allChannels.findIndex(c => c.url === currentGroupChannels[activeSubIdx].url);
                    buildOsdList();
                } else {
                    playChannel(currentIndex - 1, true);
                }
                e.preventDefault();
                break;

            case "ArrowDown":
                if (isMenuOpen) {
                    let activeSubIdx = currentGroupChannels.findIndex(c => c.url === allChannels[currentIndex].url);
                    activeSubIdx = (activeSubIdx + 1) % currentGroupChannels.length;
                    currentIndex = allChannels.findIndex(c => c.url === currentGroupChannels[activeSubIdx].url);
                    buildOsdList();
                } else {
                    playChannel(currentIndex + 1, true);
                }
                e.preventDefault();
                break;

            case "ArrowRight":
                if (isMenuOpen) {
                    currentGroupIndex = (currentGroupIndex + 1) % groupsList.length;
                    updateGroupChannels();
                } else {
                    showInfoBar();
                }
                e.preventDefault();
                break;

            case "ArrowLeft":
                if (isMenuOpen) {
                    currentGroupIndex = (currentGroupIndex - 1 + groupsList.length) % groupsList.length;
                    updateGroupChannels();
                } else {
                    showInfoBar();
                }
                e.preventDefault();
                break;

            case "Enter":
            case " ":
                if (!isMenuOpen) {
                    toggleOsd(true);
                } else {
                    playChannel(currentIndex, true);
                    toggleOsd(false);
                }
                e.preventDefault();
                break;

            case "Escape":
            case "Backspace":
                if (isMenuOpen) toggleOsd(false);
                e.preventDefault();
                break;

            case "+":
            case "=":
                video.volume = Math.min(1, video.volume + 0.1);
                showVolume();
                break;
            case "-":
                video.volume = Math.max(0, video.volume - 0.1);
                showVolume();
                break;
        }
    });

    function showVolume() {
        volumeBox.innerText = "🔊 " + Math.round(video.volume * 100) + "%";
        volumeBox.style.display = "block";
        clearTimeout(volumeTimeout);
        volumeTimeout = setTimeout(() => { volumeBox.style.display = "none"; }, 1500);
    }

    window.onload = loadM3U;
</script>

</body>
</html>
