name: Auto IPTV Scraper
on:
  schedule:
    - cron: '*/30 * * * *' # ئەمە واتە هەموو ٣٠ خولەک جارێک (نیو کاتژمێر)
  workflow_dispatch:

jobs:
  update_list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Python Scraper
        run: |
          python - <<EOF
          import requests
          
          # سەرچاوەکان بۆ دۆزینەوەی لێنک
          sources = [
              "https://raw.githubusercontent.com/Kurdish-IPTV/Sport/main/list.m3u",
              "https://iptv-org.github.io/iptv/languages/kur.m3u"
          ]
          
          final_content = "#EXTM3U\n"
          
          for url in sources:
              try:
                  r = requests.get(url, timeout=10)
                  if r.status_code == 200:
                      lines = r.text.split('\n')
                      for i in range(len(lines)):
                          # لێرەدا دەتوانیت ناوی هەر کەناڵێکی تر زیاد بکەیت
                          target_channels = ["AVA Sport", "beIN Sports", "Falcon", "Rudaw"]
                          if any(name in lines[i] for name in target_channels):
                              final_content += lines[i] + "\n" + lines[i+1] + "\n"
              except:
                  continue
          
          # پاشەکەوتکردنی فایلەکە
          with open("koyar.m3u", "w") as f:
              f.write(final_content)
          EOF

      - name: Push Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add koyar.m3u
          git commit -m "Auto-update every 30 mins" || exit 0
          git push
