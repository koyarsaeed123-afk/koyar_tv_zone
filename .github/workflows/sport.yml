name: Fixed AVA Scraper
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate M3U
        run: |
          # لێرەدا لێنکێکی زۆر جێگیر دادەنێین کە لە زۆربەی نێتەکانی کوردستان کار دەکات
          echo "#EXTM3U" > koyar.m3u
          echo "#EXTINF:-1, AVA Sport HD (Stable)" >> koyar.m3u
          echo "https://rim-hls.asiacell.com/live/ava_sport/index.m3u8" >> koyar.m3u

      - name: Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add koyar.m3u
          git commit -m "Updated to Stable Source" || exit 0
          git push
