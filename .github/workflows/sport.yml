name: Karwan TV AVA Scraper
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract Link
        run: |
          python - <<EOF
          import requests
          import re

          # سایتی کاروان تیڤی
          target_url = "https://karwan.tv/ava-sport/"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Referer": "https://karwan.tv/"
          }

          try:
              # ١. وەرگرتنی ناوەڕۆکی سایتەکە
              response = requests.get(target_url, headers=headers, timeout=20)
              content = response.text
              
              # ٢. گەڕان بەدوای لێنکەکان (بە تایبەت ئەوانەی کە بە m3u8 کۆتایی دێن و لەناو سکریپتدان)
              # زۆربەی کات لێنکەکان لەناو 'file' یان 'source' دان
              found_links = re.findall(r'(https?://[^\s"\'<>]*\.m3u8[^\s"\'<> ]*)', content)
              
              if not found_links:
                  # ئەگەر لێنکی تەواوی نەدۆزییەوە، بەدوای لێنکی ناوخۆیی (Relative) دەگەڕێین
                  found_links = re.findall(r'["\'](/[^"\']*\.m3u8[^"\']*)["\']', content)
                  found_links = ["https://karwan.tv" + l for l in found_links]

              if found_links:
                  # پاککردنەوەی لێنکەکە لە هەر نووسراوێکی زیادە
                  final_link = found_links[0].replace('\\', '')
                  
                  with open("koyar.m3u", "w") as f:
                      f.write("#EXTM3U\n")
                      f.write("#EXTINF:-1, AVA Sport (Karwan TV)\n")
                      f.write(final_link + "\n")
                  print(f"سەرکەوتوو بوو: {final_link}")
              else:
                  # ئەگەر هەر نەبوو، لێنکە جێگیرەکە وەک یەدەگ دادەنێین بۆ ئەوەی فایلەکە بەتاڵ نەبێت
                  with open("koyar.m3u", "w") as f:
                      f.write("#EXTM3U\n#EXTINF:-1, AVA Sport (Fallback)\nhttps://p-9-1.as.iptv.ovh/AVA-Sport/index.m3u8\n")
                  print("لێنکەکە لەناو کۆدەکەدا دیار نییە، یەدەگ دانرا.")

          except Exception as e:
              print(f"Error: {e}")
          EOF

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add koyar.m3u
          git commit -m "Scrape effort from Karwan TV" || exit 0
          git push
