name: Auto Update IPTV Links
on:
  schedule:
    - cron: '*/10 * * * *' # هەموو ١٠ خولەک جارێک خۆی نوێ دەکاتەوە
  workflow_dispatch: # بۆ ئەوەی خۆت بە دەستیش بتوانی نوێی بکەیتەوە

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Scraper Script
        run: |
          python - <<EOF
          import requests

          # ئەو لێنکە درێژەی کە ئێستا لە وایەرشارک دۆزیتەوە
          raw_url = "http://104.160.15.138/cache/AVA-Sport-HD-LB/playlist.m3u8"

          # ئەو ناسنامەیەی کە لە وایەرشارک بینیمان
          headers = {
              "User-Agent": "And$MyTV",
              "Connection": "Keep-Alive",
              "Host": "104.160.15.138"
          }

          # دروستکردنی فایلی m3u
          m3u_content = f"#EXTM3U\n#EXTINF:-1,AVA Sport HD\n{raw_url}"

          with open("koyar.m3u", "w") as f:
              f.write(m3u_content)
          EOF

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add koyar.m3u
          git commit -m "Automated update with User-Agent" || exit 0
          git push
