name: MYTV Permanent Scraper
on:
  schedule:
    - cron: '0 * * * *' # هەموو کاتژمێرێک خۆی نوێ دەکاتەوە
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Auto Extract Token and Link
        run: |
          python - <<EOF
          import requests
          import re

          # لێنکە سەرەکییەکە کە جەنابت دۆزیوتەوە (ئەمە کلیلەکەیە)
          api_url = "https://androidapi.appmytv.com/?fbclid=IwY2xjawQ88UZleHRuA2FlbQIxMABicmlkETFvb1lPbElpQ0toWk55U2g4c3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHkFNVwOM_gqj2nryAeSoV1IwXoPE-Ho1nF_ccovOEcgoHZwgZMaT-KdOG9XS_aem_6O58HUzgMkv6MRasIuhaNw"
          
          headers = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 9; JKM-LX1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36",
              "Referer": "https://appmytv.com/"
          }

          try:
              # ١. دەچینە ناو سێرڤەرەکە بۆ وەرگرتنی تۆکنی نوێ
              response = requests.get(api_url, headers=headers, timeout=20)
              content = response.text
              
              # ٢. گەڕان بەدوای لێنکە نوێیەکە (تۆکنەکە) لەناو وەڵامی سێرڤەرەکە
              # تێبینی: لێرەدا سکریپتەکە بەدوای هەر لێنکێکدا دەگەڕێت کە '+ph/' تێدایە
              tokens = re.findall(r'\+ph\/[a-zA-Z0-9_\-=]+', content)
              
              if tokens:
                  new_token = tokens[0] # یەکەم تۆکن وەردەگرین
                  # ٣. دروستکردنی لێنکی ئاڤا سپۆرت بە تۆکنە نوێیەکە
                  final_link = f"http://104.160.15.53/lbengine/{new_token}---/cache/AVA-Sport-HD-LB/master.m3u8"
                  
                  m3u = "#EXTM3U\n"
                  m3u += "#EXTINF:-1, AVA Sport HD (Auto-Updated)\n"
                  m3u += f"{final_link}\n"
                  
                  with open("koyar.m3u", "w") as f:
                      f.write(m3u)
                  print("سەرکەوتوو بوو! لێنکەکە نوێ کرایەوە.")
              else:
                  print("تۆکنەکە نەدۆزرایەوە، بەڵام لێنکە کۆنەکە دەهێڵینەوە")

          except Exception as e:
              print(f"هەڵە ڕوویدا: {e}")
          EOF

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add koyar.m3u
          git commit -m "Auto refresh token from API" || exit 0
          git push
