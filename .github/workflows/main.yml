name: Ultimate Sport Scraper
on:
  schedule:
    - cron: '0 */4 * * *' # هەموو ٤ کاتژمێر جارێک خۆی نوێ دەکاتەوە
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch Live Links
        run: |
          python - <<EOF
          import requests

          # لیستی ئەو کەناڵانەی کە جەنابت دەتەوێت
          target_channels = ["beIN Sports HD", "AVA Sport", "Falcon Eye 1", "NRT Sport"]
          
          # سەرچاوەیەکی جێگیر بۆ لێنکە کوردی و وەرزشییەکان (ئەمە زوو زوو نوێ دەبێتەوە)
          source_url = "https://raw.githubusercontent.com/Kurdish-IPTV/Sport/main/list.m3u"
          
          try:
              response = requests.get(source_url, timeout=15)
              if response.status_code == 200:
                  with open("koyar.m3u", "w") as f:
                      f.write(response.text)
                  print("لیستەکە بە سەرکەوتوویی نوێ کرایەوە!")
          except:
              # ئەگەر سەرچاوەی یەکەم کاری نەکرد، لێنکە جێگیرەکەی خۆمان دادەنێین
              with open("koyar.m3u", "w") as f:
                  f.write("#EXTM3U\n#EXTINF:-1, beIN Sports\nhttps://h50.baseflow.online/live/918454578001/index.m3u8")
          EOF

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add koyar.m3u
          git commit -m "Auto Update Sport Channels" || exit 0
          git push
