name: Auto Update IPTV Links
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Update Script
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          python - <<EOF
          import os

          # لێنکە نوێیەکەی کە ئێستا ناردی
          full_url = "http://104.160.15.138/B9cfgPyClaKOYm1bc0RfSWMS0rccA2acbxEv__ih__Bg85mXiBqbVrF74wnvMMDke42n6sbCh9iNsBsF6cZ9i9xxZYGoKHsiESyFNVSqewCm11xwsBv5nMnlQs__hi__mQEbwsQxdhn9XKISPB1k2OX2rDieP8yR3bT03yNQ__hi__L2gcwxKKp2MQ7F__hi__4bWM__hi__SzIq9EeRkQ0ti272vKlW0Sr1cx2tXVoIwmJwzlTA5gTria0IANjT0HFPYXZcU__ih__mUBJI1QnC3TJojaP76KHkw8exujkORRnTaDSq4ZxtZNinNzn__ih__tb4__hi____hi__FaKPQ=---/cache/AVA-Sport-HD-LB/m3u8/AVA-Sport-HD_tracks-v1a1_mono.m3u8"

          m3u_content = f"#EXTM3U\n#EXTINF:-1,AVA Sport HD\n{full_url}"

          with open("koyar.m3u", "w") as f:
              f.write(m3u_content)
          EOF

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add koyar.m3u
          git commit -m "Updated link in main.yml with m3u8" || exit 0
          git push
