name: Auto Update IPTV Links
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Update Script
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          python - <<EOF
          import os

          # لێنکە درێژەکەی وایەرشارک
          base_url = "http://104.160.15.138/idONRCyo5b9P5vEfxJKl9zxifGbnC39ppCb7OH__hi__mb956Z__hi__Ve__hi__SySATotmk6aH2__hi__agyajbfZLIT9FOxiP__ih__7QI8UqV8przaiH7oWDZdeXnWwfT6eB8KiAPdHzLpvaLtwOEfn79vREyVZNxmU21EMtETw9TQK3FzAS8PQJJ7J4p2TRVdrm2gEwLyj__ih__gB4kRuOdYWPfdVcg7RjQOUkdMAJL9rJ__ih__VuIU5RT15GFKssAsE4H__ih__cn__ih__05slzAT1Rhkv5LSGgdZmi06DpZEVRjuNzr1hTgwliuA096xsnTvNU2IONSLH7E=---/cache/AVA-Sport-HD-LB/playlist.m3u8"

          m3u_content = f"#EXTM3U\n#EXTINF:-1,AVA Sport HD\n{base_url}"

          with open("koyar.m3u", "w") as f:
              f.write(m3u_content)
          EOF

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add koyar.m3u
          git commit -m "Auto update link" || exit 0
          git push
