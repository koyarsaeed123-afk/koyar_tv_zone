name: Update IPTV
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - run: pip install requests
      - run: python update_link.py
      - run: |
          git config --global user.name 'bot'
          git config --global user.email 'bot@github.com'
          git add -A
          git commit -m "update" || exit 0
          git push
