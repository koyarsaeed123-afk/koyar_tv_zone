name: Auto Update IPTV Links
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Scraper Script
        run: |
          python - <<EOF
          # لێنکە تەواوەکە کە لە Full Request URI دۆزیتەوە
          raw_url = "http://104.160.15.53/lbengine/+ph/z8cSQ4W__ih__AeteLsz__hi__oYNcG7Zj7hQRm1uIcH__hi__S7mh__ih__8seMioRm0W__hi__2jQLZZythUM2MXk9s__hi__uUURmvDKZk9u2sCL__ih__sFaUvSgcWklZJ9enRnIVp7pKgDT56dKbPc__hi__9cXJ__hi__owJ87q8djKxJ5PsX5vISCcD72H5pSn2rM7hrc31gKdA__ih__OuwVVqrQaYB48VCBskxOG__ih__IRbCKOOIm4r5QS4w7__ih__cr9zWolwDTOMouHLaX9w0pqUoQMGlYAIzFWSbRrHERju2f8x__hi__idedMYwNml__hi__LjkhbLhN2l6QJf__ih__jptt8Y8K8Mcw__ih__o8=---/cache/AVA-Sport-HD-LB/master.m3u8"

          # دروستکردنی فایلی m3u بە شێوەیەکی ستاندارد
          m3u_content = f"#EXTM3U\n#EXTINF:-1,AVA Sport HD (Auto-Update)\n{raw_url}"

          with open("koyar.m3u", "w") as f:
              f.write(m3u_content)
          EOF

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add koyar.m3u
          git commit -m "Final Update with Correct Master URL" || exit 0
          git push
