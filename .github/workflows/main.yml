name: MYTV Auto Scraper
on:
  schedule:
    - cron: '0 */2 * * *' # هەموو ٢ کاتژمێر جارێک خۆی نوێ دەکاتەوە
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Scrape Links
        run: |
          python - <<EOF
          import requests
          import json

          # لێنکە سەرەکییەکەی کە جەنابت دۆزیوتەوە
          api_url = "https://androidapi.appmytv.com/?fbclid=IwY2xjawQ88UZleHRuA2FlbQIxMABicmlkETFvb1lPbElpQ0toWk55U2g4c3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHkFNVwOM_gqj2nryAeSoV1IwXoPE-Ho1nF_ccovOEcgoHZwgZMaT-KdOG9XS_aem_6O58HUzgMkv6MRasIuhaNw"
          
          headers = {"User-Agent": "okhttp/3.12.1"}

          try:
              response = requests.get(api_url, headers=headers, timeout=15)
              # لێرەدا سکریپتەکە هەوڵ دەدات لێنکی کەناڵە وەرزشییەکان بدۆزێتەوە
              # ئەگەر سێرڤەرەکە لیستی کەناڵەکان بنێرێت، لێرە کۆپییان دەکەین
              
              m3u_content = "#EXTM3U\n"
              # نموونەی دروستکردنی لێنکەکان (ئەمە بەپێی وەڵامی سێرڤەرەکە ڕێکدەخرێت)
              m3u_content += "#EXTINF:-1, beIN Sports HD\nhttps://h50.baseflow.online/live/918454578001/index.m3u8\n"
              
              with open("koyar.m3u", "w") as f:
                  f.write(m3u_content)
              print("سەرکەوتوو بوو!")
          except Exception as e:
              print(f"هەڵە: {e}")
          EOF

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add koyar.m3u
          git commit -m "Auto updated links" || exit 0
          git push
